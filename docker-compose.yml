# Local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# Optional extras:
#   docker compose --profile stripe up   # forward Stripe webhooks
#   docker compose --profile tools up    # Flower (Celery monitor)

x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_DEBUG: "1"
    POSTGRES_HOST: db
    REDIS_HOST: cache
    EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
  volumes:
    # live code reload: edits on the host show up in the container
    - ./myshop:/code/myshop
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_started

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py compilemessages &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A myshop worker -l info

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myshop}
      POSTGRES_USER: ${POSTGRES_USER:-myshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # To connect a DB GUI from the host, uncomment (5433 avoids clashing
    # with a locally installed Postgres):
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7.2-alpine
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"  # web UI to read sent emails (and PDF invoices)

  flower:
    <<: *app
    profiles: [tools]
    command: celery -A myshop flower --port=5555
    ports:
      - "5555:5555"

  stripe:
    image: stripe/stripe-cli:v1.21.8
    profiles: [stripe]
    command: listen --forward-to web:8000/payment/webhook/
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
