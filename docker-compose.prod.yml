# Production stack (single server).
#
#   cp .env.example .env   # then set real values, DJANGO_DEBUG=0
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec web python manage.py createsuperuser
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik, or your
# platform's load balancer) in front of port 8000.

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_HOST: cache
  volumes:
    - media:/code/myshop/media
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_started

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn myshop.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --access-logfile -"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A myshop worker -l info

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  media:
